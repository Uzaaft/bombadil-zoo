# Fixtures applied to the throwaway cluster before every campaign, so k9s
# has resources in different states to show: healthy, crash-looping,
# pending, completed, plus custom resources and awkward names.
apiVersion: v1
kind: Namespace
metadata:
  name: fuzz
  labels:
    purpose: fuzzing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fuzz
  labels: { app: web, tier: frontend }
spec:
  replicas: 3
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web, tier: frontend } }
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
        - name: sidecar
          image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db, namespace: fuzz }
spec:
  serviceName: db
  replicas: 2
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: agent, namespace: fuzz }
spec:
  selector: { matchLabels: { app: agent } }
  template:
    metadata: { labels: { app: agent } }
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
# Restarts forever, so k9s shows restarts, events and previous logs.
apiVersion: v1
kind: Pod
metadata:
  name: crashloop
  namespace: fuzz
  labels: { app: crashloop }
spec:
  containers:
    - name: crash
      image: busybox:1.36
      command: ["sh", "-c", "echo starting; echo 'ünïcödé log line 日本語'; exit 1"]
---
# Never scheduled.
apiVersion: v1
kind: Pod
metadata: { name: pending, namespace: fuzz }
spec:
  nodeSelector: { does-not-exist: "true" }
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
# Writes logs continuously, for the log view.
apiVersion: v1
kind: Pod
metadata: { name: chatty, namespace: fuzz, labels: { app: chatty } }
spec:
  containers:
    - name: log
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"line $i $(date) ─── ünïcödé\"; sleep 0.2; done"]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: tick, namespace: fuzz }
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: busybox:1.36
              command: ["sh", "-c", "date"]
---
apiVersion: batch/v1
kind: Job
metadata: { name: failing-job, namespace: fuzz }
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fail
          image: busybox:1.36
          command: ["false"]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: fuzz }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: fuzz }
spec:
  rules:
    - host: web.fuzz.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web, namespace: fuzz }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: web, namespace: fuzz }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: web } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-all, namespace: fuzz }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data, namespace: fuzz }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Mi } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: awkward-name-with-a-very-long-suffix-to-test-truncation-in-tables-and-columns
  namespace: fuzz
  labels: { app: web }
  annotations:
    note: "multi\nline\nannotation with ─── box drawing and 日本語"
data:
  config.yaml: |
    key: value
    nested:
      list: [1, 2, 3]
  empty: ""
---
apiVersion: v1
kind: Secret
metadata: { name: credentials, namespace: fuzz }
type: Opaque
stringData:
  username: fuzz
  password: "p@ss wörd"
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: robot, namespace: fuzz }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: reader, namespace: fuzz }
rules:
  - apiGroups: [""]
    resources: [pods, configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: robot-reader, namespace: fuzz }
subjects: [{ kind: ServiceAccount, name: robot, namespace: fuzz }]
roleRef: { kind: Role, name: reader, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: quota, namespace: fuzz }
spec:
  hard: { pods: "50" }
---
apiVersion: v1
kind: LimitRange
metadata: { name: limits, namespace: fuzz }
spec:
  limits:
    - type: Container
      default: { memory: 64Mi }
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: widgets.fuzz.example.com }
spec:
  group: fuzz.example.com
  scope: Namespaced
  names: { plural: widgets, singular: widget, kind: Widget, shortNames: [wg] }
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - { name: Size, type: string, jsonPath: .spec.size }
